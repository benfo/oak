name: Release packages

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      publish_linux:
        description: Add Linux packages to the existing published version (otherwise build test artifacts only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: app-release
  cancel-in-progress: false

jobs:
  windows:
    if: github.event_name != 'workflow_dispatch' || !inputs.publish_linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
      - name: Validate release version and notes
        if: github.event_name == 'push'
        shell: bash
        run: node scripts/validate-release.cjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: oak-windows-packages
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 7

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
      - name: Validate release version and notes
        if: github.event_name == 'push'
        run: node scripts/validate-release.cjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run dist:linux
      - name: Install and test the Debian package
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/*.deb xvfb
          xvfb-run -a npm run test:linux-package
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: linux-smoke-diagnostics
          path: out/linux-smoke/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: oak-linux-packages
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [windows, linux]
    if: >-
      always() &&
      ((github.event_name == 'push' && needs.windows.result == 'success' && needs.linux.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_linux && needs.linux.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.21.0
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: oak-*-packages
          path: dist
          merge-multiple: true
      - name: Publish complete release
        if: github.event_name == 'push'
        run: node scripts/release.cjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Add Linux downloads to existing release
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/release.cjs --linux-only
        env:
          GH_TOKEN: ${{ github.token }}
